<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear perfil — Red de Actores</title><link rel="stylesheet" href="css/styles.css"></head><body><header class="topbar"><div class="container nav"><a class="brandlock" href="index.html"><img class="red-logo" src="assets/logo-red-actores.svg"></a></div></header><main class="page-shell"><div class="container"><form class="form-card" onsubmit="event.preventDefault();alert('Demo V0.1: el alta real se conectará con Supabase Auth.')"><h1>Crear mi perfil</h1><div class="notice">La fecha de nacimiento se utiliza para calcular tu edad automáticamente. No se mostrará públicamente.</div><div class="form-row" style="margin-top:18px"><div class="field"><label>Nombre artístico / completo</label><input required></div><div class="field"><label>Fecha de nacimiento</label><input type="date" required></div><div class="field"><label>Localidad</label><input required placeholder="Córdoba Capital"></div><div class="field"><label>Email</label><input type="email" required></div></div><div class="field"><label>Sobre mí</label><textarea rows="4" maxlength="500"></textarea></div><div class="field"><label>Habilidades (máximo 7)</label><input placeholder="Inglés, canto, danza, improvisación..."></div><div class="field"><label>Video de presentación — YouTube o Vimeo</label><input type="url" required placeholder="https://..."></div><div class="field"><label><input type="checkbox"> Acepto trabajos estudiantiles / no remunerados</label></div><button class="btn btn-primary">Continuar</button></form></div></main></body></html>
